name: Deploy Lambdas to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: [odoo_timesheets, odoo_reader]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Prepare Lambda build folder
      run: |
        rm -rf build/${{ matrix.lambda }}
        mkdir -p build/${{ matrix.lambda }}

    - name: Install dependencies into build folder
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ matrix.lambda }}/requirements.txt -t build/${{ matrix.lambda }}

    - name: Copy Lambda source code
      run: |
        rsync -av --exclude='.git' ${{ matrix.lambda }}/*.py build/${{ matrix.lambda }}/

    - name: Deploy to AWS Lambda
      uses: aws-actions/aws-lambda-deploy@v1
      with:
        function-name: ${{ matrix.lambda }}
        runtime: python3.9
        handler: lambda_function.lambda_handler
        code-artifacts-dir: build/${{ matrix.lambda }}
