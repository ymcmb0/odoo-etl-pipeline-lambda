name: Deploy Odoo Reader Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  LAMBDA_NAME: odoo_reader  # single merged Lambda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Prepare Lambda build folder
      run: |
        rm -rf build/${{ env.LAMBDA_NAME }}
        mkdir -p build/${{ env.LAMBDA_NAME }}

    - name: Install dependencies
      run: |
        pip install -r ${{ env.LAMBDA_NAME }}/requirements.txt -t build/${{ env.LAMBDA_NAME }}

    - name: Copy Lambda source code
      run: |
        cp ${{ env.LAMBDA_NAME }}/*.py build/${{ env.LAMBDA_NAME }}/

    - name: Deploy merged Lambda to AWS
      uses: aws-actions/aws-lambda-deploy@v1
      with:
        function-name: ${{ env.LAMBDA_NAME }}
        runtime: python3.9
        handler: lambda_function.lambda_handler
        code-artifacts-dir: build/${{ env.LAMBDA_NAME }}
