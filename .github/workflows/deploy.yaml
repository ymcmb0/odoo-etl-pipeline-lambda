name: Deploy Lambdas to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: [odoo_timesheets, odoo_reader]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      working-directory: ${{ matrix.lambda }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -t .

    - name: Prepare Lambda artifact folder
      run: |
        mkdir -p build/${{ matrix.lambda }}
        rsync -av --exclude '.git' --exclude 'docs' --exclude 'infra' ${{ matrix.lambda }}/ build/${{ matrix.lambda }}/

    - name: Deploy to AWS Lambda
      uses: aws-actions/aws-lambda-deploy@v1
      with:
        function-name: ${{ matrix.lambda }}
        code-artifacts-dir: build/${{ matrix.lambda }}
